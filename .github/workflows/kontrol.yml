name: Kaynak kontrolu (tek seferlik)
on:
  push:
    branches: [main]
    paths: ["tools/kontrol.py"]
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests openpyxl
      - uses: actions/cache/restore@v4
        with:
          path: |
            veri/bkms
            veri/DE_plz.zip
          key: veri-x
          restore-keys: veri-
      - run: ls veri/bkms | wc -l && python tools/kontrol.py
