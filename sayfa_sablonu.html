<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>İhale Radarı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f4f6f1,#0f1712);--card:light-dark(#ffffff,#16221a);--ink:light-dark(#14201a,#e6efe8);
--mut:light-dark(#5b6b61,#93a69a);--line:light-dark(#dfe6dc,#243429);--g:#1f6b45;--g2:light-dark(#e3f1e7,#173726);
--red:#c8372d;--redbg:light-dark(#fde5e2,#3a1714);--amb:#a86a00;--ambbg:light-dark(#fff1cf,#33270c);--acc:#2f8f5b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif;overflow-x:clip}
header{background:var(--g);color:#fff;padding:28px max(5vw,16px) 22px;position:relative}
.lang{position:absolute;top:16px;right:max(5vw,16px);display:flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden}
.lang button{background:transparent;color:#fff;border:0;font:inherit;font-weight:600;padding:8px 14px;min-height:40px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--g)}
h1{margin:0;padding-right:120px;font-weight:300;font-size:clamp(32px,6vw,48px);line-height:1.05}
.sub{opacity:.85;margin-top:6px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:18px}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1}
.stat span{font-size:13px;opacity:.85}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(4vw,12px) 60px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font:inherit;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar input[type=search],.bar select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px}
.bar input[type=search]{flex:1 1 220px}
.chk{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 6px}
.xl{margin-left:auto;color:var(--g);font-weight:600;text-decoration:none;padding:10px 4px}
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px}
.card.new{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
.sc{grid-row:span 3;width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;background:var(--g2);color:var(--g);line-height:1}
.sc small{font-size:10px;font-weight:600;margin-top:3px;opacity:.8}
.legend{font-size:13px;color:var(--mut);margin:-4px 0 12px}
.t{font-weight:600;font-size:17px;line-height:1.3}
.t .nw{font-size:12px;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.m{color:var(--mut);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.dl{font-size:14px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--g2);white-space:nowrap}
.dl.r{background:var(--redbg);color:var(--red)}.dl.a{background:var(--ambbg);color:var(--amb)}
.why{font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;background:var(--g);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.btn.o{background:transparent;color:var(--g);border:1px solid var(--line)}
.row select{font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:40px;margin-left:auto}
.empty{padding:40px;text-align:center;color:var(--mut)}
footer{color:var(--mut);font-size:13px;margin-top:28px;line-height:1.6}
@media(max-width:600px){.card{grid-template-columns:42px minmax(0,1fr)}.sc{width:42px;height:42px;font-size:14px}.row select{margin-left:0}.xl{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="lang" role="group" aria-label="Dil / Sprache"><button data-l="tr">TR</button><button data-l="de">DE</button></div>
  <h1 id="h1">İhale Radarı</h1>
  <div class="sub" id="sub"></div>
  <div class="stats" id="stats"></div>
</header>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-k="acik" aria-selected="true"></button>
    <button class="tab" role="tab" data-k="on" aria-selected="false"></button>
    <button class="tab" role="tab" data-k="sonuc" aria-selected="false"></button>
  </div>
  <div class="bar">
    <input type="search" id="q">
    <select id="tp"><option value="bakim"></option><option value="yapim"></option><option value=""></option></select>
    <select id="km"><option value="999"></option><option value="30">≤ 30 km</option><option value="50">≤ 50 km</option><option value="70">≤ 70 km</option><option value="85">≤ 85 km</option></select>
    <select id="st"></select>
    <label class="chk"><input type="checkbox" id="nw"> <span id="nwl"></span></label>
    <a class="xl" id="xl" href="Ihaleler.xlsx"></a>
  </div>
  <div class="legend" id="legend"></div>
  <div class="list" id="list"></div>
  <footer id="foot"></footer>
</div>
<script>
{
const D = __DATA__;
const M = __META__;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T = {
 tr: {title:"İhale Radarı", sub:(m,k,g)=>`${m} çevresi ${k} km · güncellendi ${g}`, s1:"açık ihale", s2:"yeni (bugün)", s3:"son tarih 7 gün içinde", s4:"yakında çıkacak",
   tp_bakim:"Bakım işleri (çim, hecke, ağaç, kış)", tp_yapim:"Peyzaj yapım (Außenanlagen)", tp_all:"Tüm işler", t_acik:"Açık ihaleler", t_on:"Yakında çıkacak", t_sonuc:"Sonuçlananlar", q:"Ara: şehir, iş, kurum…", allkm:"Tüm mesafeler", allst:"Tüm durumlar", unmarked:"İşaretsiz",
   onlynew:"Sadece yeni", xl:"Excel indir ↓", score:"puan", son:"Son", days:"gün", nodl:"Son tarih ilanda", pub:"Yayın", winner:"Kazanan", approx:"yakl.",
   open:"İlanı aç", docs:"Belgeler / platform", status:"Durum…", lots:"Lose", empty:"Bu filtreye uyan ilan yok.", nw:"YENİ", untitled:"(başlıksız)",
   legend:"Soldaki sayı uygunluk puanı (0–100): peyzaj iş kodu (CPV) +45, başlıkta peyzaj kelimesi +20–35, metinde +15'e kadar, yakınlık +20'ye kadar. 80+ kesin sizin işiniz, 50–70 bakmaya değer.",
   why:{"Başlık:":"Başlık:","Metin:":"Metin:"},
   st:{"İncele":"İncele","Teklif Ver":"Teklif Ver","Teklif Verildi":"Teklif Verildi","Pas":"Pas"},
   foot:k=>`Kaynaklar: ${k}. Her sabah otomatik güncellenir; bir günün ilanları ertesi sabah görünür. Durum işaretleri sadece bu tarayıcıda saklanır. Teklif, ilan sayfasındaki ihale platformu üzerinden verilir. Bazı küçük belediye ilanları (sadece kendi sitesinde yayınlananlar) bu kaynaklarda olmayabilir.`},
 de: {title:"Ausschreibungsradar", sub:(m,k,g)=>`Umkreis ${k} km um ${m} · aktualisiert ${g}`, s1:"offene Ausschreibungen", s2:"neu (heute)", s3:"Frist in 7 Tagen", s4:"Vorinformationen",
   tp_bakim:"Pflege (Mahd, Hecke, Baum, Winterdienst)", tp_yapim:"GaLaBau-Neubau (Außenanlagen)", tp_all:"Alle Leistungen", t_acik:"Offene Ausschreibungen", t_on:"Vorinformationen", t_sonuc:"Vergeben", q:"Suche: Ort, Leistung, Vergabestelle…", allkm:"Alle Entfernungen", allst:"Alle Status", unmarked:"Ohne Markierung",
   onlynew:"Nur neue", xl:"Excel herunterladen ↓", score:"Punkte", son:"Frist", days:"Tage", nodl:"Frist siehe Bekanntmachung", pub:"Veröffentlicht", winner:"Zuschlag an", approx:"ca.",
   open:"Bekanntmachung öffnen", docs:"Unterlagen / Plattform", status:"Status…", lots:"Lose", empty:"Keine Ausschreibungen für diesen Filter.", nw:"NEU", untitled:"(ohne Titel)",
   legend:"Die Zahl links ist die Passgenauigkeit (0–100): GaLaBau-CPV-Code +45, Fachbegriff im Titel +20–35, im Text bis +15, Nähe bis +20. Ab 80 klar passend, 50–70 prüfenswert.",
   why:{"Başlık:":"Titel:","Metin:":"Text:"},
   st:{"İncele":"Prüfen","Teklif Ver":"Angebot abgeben","Teklif Verildi":"Angebot abgegeben","Pas":"Kein Interesse"},
   foot:k=>`Quellen: ${k}. Tägliche automatische Aktualisierung; Bekanntmachungen eines Tages erscheinen am nächsten Morgen. Status-Markierungen werden nur in diesem Browser gespeichert. Angebote werden über die in der Bekanntmachung genannte Vergabeplattform abgegeben. Einzelne kleine kommunale Ausschreibungen (nur auf eigener Website veröffentlicht) sind ggf. nicht enthalten.`}
};
let L = "tr";
try { L = localStorage.getItem("ihale-dil") || "tr"; } catch (e) {}
const KEY = "ihale-durum";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
let tab = "acik";
const $ = id => document.getElementById(id);
const tp = $("tp"), q = $("q"), km = $("km"), st = $("st"), nw = $("nw"), list = $("list");
const STV = ["İncele", "Teklif Ver", "Teklif Verildi", "Pas"];
const why = s => { let o = String(s || ""); for (const [a, b] of Object.entries(T[L].why)) o = o.split(a).join(b); return o; };

function chrome() {
  const t = T[L];
  document.documentElement.lang = L;
  document.title = t.title;
  $("h1").textContent = t.title;
  $("sub").textContent = t.sub(M.merkez, M.km, M.guncel);
  const week = D.acik.filter(x => x.kalan !== null && x.kalan <= 7).length;
  $("stats").innerHTML = [[D.acik.length, t.s1], [D.acik.filter(x => x.yeni).length + D.on.filter(x => x.yeni).length, t.s2], [week, t.s3], [D.on.length, t.s4]]
    .map(([n, l]) => `<div class="stat"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.textContent = t["t_" + b.dataset.k]);
  q.placeholder = t.q; q.setAttribute("aria-label", t.q);
  km.options[0].textContent = t.allkm;
  tp.options[0].textContent = t.tp_bakim; tp.options[1].textContent = t.tp_yapim; tp.options[2].textContent = t.tp_all;
  const cur = st.value;
  st.innerHTML = `<option value="">${esc(t.allst)}</option><option value="-">${esc(t.unmarked)}</option>` + STV.map(v => `<option value="${esc(v)}">${esc(t.st[v])}</option>`).join("");
  st.value = cur;
  $("nwl").textContent = t.onlynew;
  $("xl").textContent = t.xl;
  $("legend").textContent = t.legend;
  $("foot").textContent = t.foot(M.kaynaklar);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === L));
}

function card(x) {
  const t = T[L], m = marks[x.id] || "";
  let dl = "";
  if (tab === "acik") {
    const cls = x.kalan === null ? "" : x.kalan < 7 ? " r" : x.kalan < 14 ? " a" : "";
    dl = x.son ? `<span class="dl${cls}">${esc(t.son)}: ${esc(x.son)}${x.kalan !== null ? ` · ${esc(x.kalan)} ${esc(x.kalan === 1 && L === "de" ? "Tag" : t.days)}` : ""}</span>` : `<span class="dl">${esc(t.nodl)}</span>`;
  } else if (tab === "on") {
    dl = `<span class="dl">${esc(t.pub)}: ${esc(x.yayin)}</span>`;
  } else {
    dl = `<span class="dl">${esc(x.yayin)}</span>` + (x.kazanan ? `<span class="m">${esc(t.winner)}: <b>${esc(x.kazanan)}</b></span>` : "") +
      (x.bedel ? `<span class="m">· ${esc(Math.round(x.bedel).toLocaleString("de-DE"))} €</span>` : "");
  }
  const sel = tab === "sonuc" ? "" : `<select data-id="${esc(x.id)}" aria-label="${esc(t.status)}"><option value="">${esc(t.status)}</option>${STV.map(v => `<option value="${esc(v)}"${v === m ? " selected" : ""}>${esc(t.st[v])}</option>`).join("")}</select>`;
  const place = [x.yer, x.km !== null ? `${x.km} km${x.tahmini ? " (" + t.approx + ")" : ""}` : ""].filter(Boolean).join(" · ");
  return `<article class="card${x.yeni ? " new" : ""}">
    <div class="sc" title="${esc(t.legend)}">${esc(x.puan)}<small>${esc(t.score)}</small></div>
    <div class="t">${x.yeni ? `<span class="nw">${esc(t.nw)}</span>` : ""}${esc(x.baslik || t.untitled)}</div>
    <div class="m">${esc(x.makam)}${place ? " — " + esc(place) : ""}${x.tur ? " · " + esc(x.tur) : ""}${x.deger ? " · ~" + esc(Math.round(x.deger).toLocaleString("de-DE")) + " €" : ""}</div>
    <div>
      <div class="row">${dl}</div>
      <div class="why">${esc(why(x.neden))}${x.lotlar ? " · " + esc(t.lots) + ": " + esc(x.lotlar) : ""}</div>
      <div class="row"><a class="btn" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(t.open)}</a>${x.belge ? `<a class="btn o" href="${esc(x.belge)}" target="_blank" rel="noopener">${esc(t.docs)}</a>` : ""}${sel}</div>
    </div>
  </article>`;
}

function render() {
  const s = q.value.trim().toLocaleLowerCase("de");
  const max = +km.value;
  const items = D[tab].filter(x =>
    (!s || [x.baslik, x.makam, x.yer, x.lotlar, x.neden, x.kazanan].join(" ").toLocaleLowerCase("de").includes(s)) &&
    (!tp.value || x.is === tp.value) && (x.km === null || x.km <= max) && (!nw.checked || x.yeni) &&
    (!st.value || (st.value === "-" ? !marks[x.id] : marks[x.id] === st.value)));
  list.innerHTML = items.length ? items.map(card).join("") : `<div class="empty">${esc(T[L].empty)}</div>`;
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  L = b.dataset.l;
  try { localStorage.setItem("ihale-dil", L); } catch (e) {}
  chrome(); render();
}));
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.k;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
  render();
}));
[tp, q, km, st, nw].forEach(el => el.addEventListener("input", render));
list.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  if (e.target.value) marks[id] = e.target.value; else delete marks[id];
  save();
});
chrome();
render();
}
</script>
</body>
</html>
